<!DOCTYPE html>
<html>
<head>
    <title>Inscription</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        input { padding: 5px; width: 200px; }
        .password-hint { font-size: 0.9em; color: #666; }
        .menu { margin-top: 20px; }
        .menu a { margin-right: 15px; color: #0066cc; }
    </style>
</head>
<body>
    <h2>Créer un compte</h2>
    
    <div id="message"></div>
    
    <form action="register" method="post">
        <div class="form-group">
            <label>Nom d'utilisateur:</label><br>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Mot de passe:</label><br>
            <input type="password" name="password" required>
            <div class="password-hint">Minimum 6 caractères</div>
        </div>
        <div class="form-group">
            <label>Confirmer le mot de passe:</label><br>
            <input type="password" name="confirmPassword" required>
        </div>
        <input type="submit" value="S'inscrire">
    </form>
    
    <div class="menu">
        <a href="login.html">Déjà un compte ? Se connecter</a><br>
        <a href="index.html">Retour au menu</a>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const messageDiv = document.getElementById('message');
        const error = urlParams.get('error');
        
        if (error) {
            if (error === 'exists') {
                messageDiv.innerHTML = '<p class="error">Ce nom d\'utilisateur existe déjà.</p>';
            } else if (error === 'password') {
                messageDiv.innerHTML = '<p class="error">Les mots de passe ne correspondent pas.</p>';
            } else if (error === 'short') {
                messageDiv.innerHTML = '<p class="error">Le mot de passe doit contenir au moins 6 caractères.</p>';
            }
        }
    </script>
</body>
</html>
